services:
  - type: web
    name: kompare-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KOMPARE_AI_PROFILE
        value: gemini_free
      - key: QDRANT_URL
        sync: false
        placeholder: "Enter Qdrant Cloud Cluster URL (e.g., https://xyz.qdrant.io:6333)"
      - key: QDRANT_API_KEY
        sync: false
        placeholder: "Enter Qdrant Cloud API Key"
      - key: GEMINI_API_KEY
        sync: false
        placeholder: "Enter Default Server Gemini API Key (Optional)"
