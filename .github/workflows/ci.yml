name: CI

# Pushing to main deploys production via Cloudflare Pages, and Pages only
# checks that the build compiles. This runs the tests that Pages does not.
on:
  push:
    branches: [main, development-branch]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm --prefix frontend ci

      # Includes tests/unit/docs.test.js, which fails when docs/ names a file,
      # command, link, or endpoint that does not exist.
      - name: Unit tests
        run: npm --prefix frontend test -- --run

      - name: Production build
        run: npm --prefix frontend run build
